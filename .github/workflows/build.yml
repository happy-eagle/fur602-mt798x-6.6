name: Build FUR-602 (mt798x-6.6 / MTK SDK / closed-source WiFi)

# 手动触发，或 push 到 main 且改动本工程文件时触发
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "padavanonly 源码分支"
        required: false
        default: "openwrt-24.10-6.6"
  push:
    branches: [main, master]
    paths:
      - "dts/**"
      - "mk/**"
      - "defconfig/**"
      - "diy-part2.sh"
      - ".github/workflows/**"

concurrency:
  group: fur602-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      SRC_BRANCH: ${{ github.event.inputs.source_ref || 'openwrt-24.10-6.6' }}
      REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/lib/node_modules /usr/share/swift || true
          sudo apt-get clean
          df -h /
          FREE_GB=$(df -Pk / | awk 'NR==2{print int($4/1024/1024)}')
          echo "free: ${FREE_GB}GB"
          [ "$FREE_GB" -ge 25 ] || { echo "::error::磁盘不足 25GB，编译会中途爆盘"; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libncursesw5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget curl ccache libelf-dev ecj fastjar \
            java-propose-classpath python3-setuptools swig time xsltproc zstd

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-fur602-${{ env.SRC_BRANCH }}-${{ github.sha }}
          restore-keys: |
            ccache-fur602-${{ env.SRC_BRANCH }}-
            ccache-fur602-

      - name: Clone source tree
        run: |
          git clone -b "$SRC_BRANCH" --single-branch --filter=blob:none \
            "$REPO" owrt
          cd owrt
          echo "HEAD: $(git rev-parse HEAD)"
          echo "kernel-6.6: $(grep -m1 '^LINUX_VERSION-6.6' include/kernel-6.6 || true)"

      - name: Update & install feeds
        working-directory: owrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply FUR-602 device support
        working-directory: owrt
        run: |
          bash "$GITHUB_WORKSPACE/diy-part2.sh"
          # 断言：设备真的注册进去了
          grep -q 'define Device/honor_fur-602' target/linux/mediatek/image/filogic.mk
          test -f target/linux/mediatek/dts/mt7981b-honor-fur-602.dts
          grep -q 'honor,fur-602|' target/linux/mediatek/filogic/base-files/etc/board.d/02_network
          grep -q 'mtd_get_mac_binary Factory 0x2a' target/linux/mediatek/filogic/base-files/etc/board.d/02_network
          grep -q 'KernelPackage/mediatek_hnat' target/linux/mediatek/modules.mk
          grep -q '^CONFIG_NET_MEDIATEK_HNAT=m$' target/linux/mediatek/filogic/config-6.6

      - name: Configure
        working-directory: owrt
        run: |
          cp defconfig/mt7981-honor-fur602.config .config
          echo "CONFIG_CCACHE=y" >> .config
          echo "CONFIG_CCACHE_DIR=\"$HOME/.ccache\"" >> .config
          make defconfig
          # 二次确认最终 .config
          grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_honor_fur-602=y' .config \
            || { echo "::error::honor_fur-602 未进入最终 .config"; exit 1; }
          grep -q '^CONFIG_PACKAGE_kmod-mt_wifi=y' .config \
            || { echo "::error::闭源 mt_wifi 未启用"; exit 1; }
          if grep -qE '^CONFIG_PACKAGE_kmod-mt7915e=y' .config; then
            echo "::error::开源 mt76 混入，会与 mt_wifi 冲突"; exit 1
          fi
          ccache -s || true

      - name: Download package sources
        working-directory: owrt
        run: |
          make download -j8 || make download -j1 V=s || \
            echo "::warning::部分源码包下载失败，继续编译；缺包会在编译阶段暴露"
          df -h /

      - name: Build firmware
        working-directory: owrt
        run: |
          df -h /
          # 关键：make 后面接了 tee，管道默认取 tee 的退出码，
          # 会把 make 的失败吃掉（踩过一次：构建挂了但 step 显示 success）。
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log
          echo "=== 产物 ==="
          ls -lh bin/targets/mediatek/filogic/
          # 断言真的出了固件，防止"成功但没有 .bin"
          ls bin/targets/mediatek/filogic/*honor*fur*sysupgrade*.bin >/dev/null 2>&1 \
            || { echo "::error::没有生成 sysupgrade 固件，构建实际失败"; tail -60 build.log; exit 1; }
          ls bin/targets/mediatek/filogic/*honor*fur*factory*.bin >/dev/null 2>&1 \
            || { echo "::error::没有生成 factory 固件"; tail -60 build.log; exit 1; }
          ccache -s || true

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          cp -v owrt/bin/targets/mediatek/filogic/*honor*fur* out/ 2>/dev/null || true
          cp -v owrt/bin/targets/mediatek/filogic/*.json out/ 2>/dev/null || true
          cp -v owrt/bin/targets/mediatek/filogic/*.buildinfo out/ 2>/dev/null || true
          cp -v owrt/build.log out/ 2>/dev/null || true
          ( cd out && sha256sum * > sha256sums.txt 2>/dev/null ) || true
          ls -lh out || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: fur602-mt798x-6.6-${{ env.SRC_BRANCH }}
          path: out/*
          if-no-files-found: warn
          retention-days: 30
